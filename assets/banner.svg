<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <radialGradient id="glowGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" />
    </filter>

    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#374151" stroke-width="0.8" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 48px;
      font-weight: 800;
      fill: url(#textGrad);
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 20px;
      font-weight: 500;
      fill: #e5e7eb;
      letter-spacing: 0.3px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      font-weight: 600;
      fill: #ffffff;
    }
    .orbit-dot-1 {
      animation: float1 7s ease-in-out infinite alternate;
    }
    .orbit-dot-2 {
      animation: float2 9s ease-in-out infinite alternate;
    }
    .pulse-glow {
      animation: pulse 4s ease-in-out infinite alternate;
    }
    @keyframes float1 {
      0% { transform: translateY(0px) translateX(0px); }
      100% { transform: translateY(-30px) translateX(20px); }
    }
    @keyframes float2 {
      0% { transform: translateY(0px) translateX(0px); }
      100% { transform: translateY(35px) translateX(-25px); }
    }
    @keyframes pulse {
      0% { opacity: 0.35; transform: scale(0.96); }
      100% { opacity: 0.7; transform: scale(1.04); }
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="400" rx="16" fill="url(#gridPattern)" />

  <!-- Dynamic Ambient Glowing Orbs in Background -->
  <g class="pulse-glow" style="transform-origin: center;">
    <circle cx="200" cy="120" r="140" fill="url(#glowGold)" filter="url(#blurFilter)" />
    <circle cx="1020" cy="280" r="160" fill="url(#glowPurple)" filter="url(#blurFilter)" />
  </g>

  <!-- Dynamic Moving Particles (Background) -->
  <g class="orbit-dot-1">
    <circle cx="150" cy="280" r="4" fill="#fbbf24" opacity="0.6" />
    <circle cx="280" cy="80" r="3" fill="#60a5fa" opacity="0.7" />
    <circle cx="950" cy="120" r="5" fill="#f472b6" opacity="0.6" />
  </g>
  <g class="orbit-dot-2">
    <circle cx="1050" cy="180" r="4" fill="#a78bfa" opacity="0.7" />
    <circle cx="380" cy="320" r="3" fill="#34d399" opacity="0.5" />
    <circle cx="850" cy="300" r="4" fill="#fbbf24" opacity="0.6" />
  </g>

  <!-- Foreground Content: Unobscured Title, Subtitle, and Feature Badges -->
  <g id="foreground-content">
    <!-- Icon / Trophy Graphic -->
    <g transform="translate(600, 110)">
      <circle cx="0" cy="0" r="44" fill="#1e293b" stroke="#f59e0b" stroke-width="2.5" />
      <!-- Medal Trophy Emoji / Icon -->
      <path d="M-15,-15 L15,-15 L12,4 C10,14 0,18 0,18 C0,18 -10,14 -12,4 Z" fill="#f59e0b" />
      <path d="M-5,18 L5,18 L7,25 L-7,25 Z" fill="#d97706" />
      <rect x="-10" y="25" width="20" height="4" rx="2" fill="#b45309" />
      <path d="M-15,-10 C-22,-10 -22,0 -14,2" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />
      <path d="M15,-10 C22,-10 22,0 14,2" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- Main Title -->
    <text class="title" x="600" y="200" text-anchor="middle">INTERNATIONAL SCIENCE OLYMPIADS</text>

    <!-- Subtitle -->
    <text class="subtitle" x="600" y="240" text-anchor="middle">All-Time Cumulative Medal Table &amp; Per Capita Statistics</text>

    <!-- Olympiad Pills / Badges in Foreground -->
    <!-- IOI Pill -->
    <g transform="translate(420, 280)">
      <rect x="-65" y="0" width="130" height="38" rx="19" fill="#1e293b" stroke="#3b82f6" stroke-width="1.8" />
      <text class="badge-text" x="0" y="24" text-anchor="middle" fill="#60a5fa">💻 IOI</text>
    </g>

    <!-- IMO Pill -->
    <g transform="translate(600, 280)">
      <rect x="-65" y="0" width="130" height="38" rx="19" fill="#1e293b" stroke="#ec4899" stroke-width="1.8" />
      <text class="badge-text" x="0" y="24" text-anchor="middle" fill="#f472b6">📐 IMO</text>
    </g>

    <!-- IPhO Pill -->
    <g transform="translate(780, 280)">
      <rect x="-65" y="0" width="130" height="38" rx="19" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.8" />
      <text class="badge-text" x="0" y="24" text-anchor="middle" fill="#c084fc">⚛️ IPhO</text>
    </g>

    <!-- Accent Underline Bar -->
    <rect x="450" y="345" width="300" height="3" rx="1.5" fill="url(#textGrad)" opacity="0.8" />
  </g>
</svg>
